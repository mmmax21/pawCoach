id: leash_pulling
name: 牵绳暴冲
category: puppy_behavior
typical_age_weeks: [16, 52]
diagnosis_tree:
  - q: 牵绳出门的时候，主要是哪种情况？
    options:
      - text: 还没习惯牵绳：原地不动、咬绳子、往后缩
        result: leash_not_accepted
      - text: 从出门到回家一路都在往前拉
        next: 1
      - text: 平时还行，看到特定东西才突然冲
        next: 2
  - q: 在家里或小区安静的角落，它能不能跟着你走几步不拉？
    options:
      - text: 可以，一到热闹的地方就不行
        result: pulling_distractions
      - text: 不行，哪里都拉
        result: pulling_untrained
  - q: 看到什么会冲？
    options:
      - text: 别的狗、猫、鸟，想追或想去玩
        next: 3
      - text: 熟人、小孩，想去打招呼
        result: pulling_distractions
  - q: 冲的时候有没有吠叫、炸毛、低吼？
    options:
      - text: 没有，就是兴奋地拽
        result: pulling_distractions
      - text: 有，叫得很凶，或者身体绷得很紧
        result: lunging_reactivity
solutions:
  leash_not_accepted:
    summary: 狗还没把牵绳当成正常的东西，脖子上多了个东西、后面还有人拉着，它会不舒服或者害怕。这个阶段不用练走路，先让它觉得戴绳子等于有好事。
    skills: [name_response, lure_follow, leash_intro]
    management:
      - 先在家里戴项圈或胸背，戴上就给零食，戴 5 分钟摘掉，每天多来几次。
      - 绳子扣上之后先不牵，让它拖着绳子在家里走，你在旁边撒零食。
      - 它咬绳子时不拉扯，手里拿玩具换掉绳子，或者把绳子换成它不爱咬的材质。
      - 第一次出门选安静时段、离家门口不超过 50 米，走几步就回家，不要一上来就遛半小时。
      - 它停下不走时别硬拽，蹲下来叫名字，走过来了就给零食。
    escalate_if: 戴绳 2 周后还是极度抗拒（尖叫、瘫倒、拼命挣脱），或者出门就发抖、夹尾巴不动，建议咨询专业训犬师做脱敏方案。
  pulling_untrained:
    summary: 狗拉绳是因为拉了就能到想去的地方，这是它学会的。要让它明白松绳才能往前走、拉紧就哪也去不了。这需要时间，16 周以后才建议正式练松绳行走。
    skills: [name_response, leash_intro, loose_leash]
    management:
      - 给它换一条 1.5-2 米的固定长度绳子，不要用伸缩绳，伸缩绳每次都在奖励拉扯。
      - 绳子拉紧就停下站着不动，绳子一松或它回头看你，马上说"好"然后继续走。
      - 出门前先在家里消耗一点精力（玩 5 分钟找零食游戏），不要在它最兴奋的时候练。
      - 正式练习每次只走 5-10 分钟，先在楼道、小区内这种安静环境，再去马路。
      - 需要赶时间或者带它去放风的时候，用胸背 + 长绳明确告诉自己"这段不练"，和练习时间分开。
    escalate_if: 系统练习 6 周后在安静环境里还是完全拉不住，或者拉绳时经常把人拽倒、绳子勒到它咳嗽，建议找训犬师当面看一下。
  pulling_distractions:
    summary: 它在安静环境已经会松绳走了，问题是一有吸引它的东西就什么都忘了。重点是把"看到有意思的东西先看主人"练成习惯，并控制好距离，别一上来就在最难的场景练。
    skills: [name_response, sit, loose_leash]
    management:
      - 看到它感兴趣的东西（狗、人、鸟）时，在它还没开始冲之前就叫名字，回头就给高价值零食。
      - 保持它还能听你话的距离，远远看到狗就先停下或绕开，等它能看着你再慢慢缩短距离。
      - 带特别好吃的零食（鸡肉、奶酪）专门用在有干扰的场合，平时在家不给。
      - 让它想去打招呼的时候，先坐下、绳子松了才带它过去，去打招呼本身就是奖励。
      - 一周里安排 2-3 次"干扰练习"，专门去公园边上远远地练，其他时间走它熟悉的安静路线。
    escalate_if: 看到别的狗时越来越激动、开始吠叫或低吼，或者有一次冲过去和别的狗打起来，不要再自己练接近，咨询专业训犬师。
  lunging_reactivity:
    summary: 冲的同时又叫又炸毛，说明它不只是兴奋，而是紧张、害怕或过度刺激。这种情况硬拉或者强行靠近会让它更糟。现阶段目标不是"不冲"，而是给它足够的距离，让它在看到刺激时还能保持冷静。
    skills: [name_response, loose_leash, calm_settle]
    management:
      - 找到它的"安全距离"：在这个距离看到狗它还能吃零食、能回头看你，以后遛狗都尽量保持在这个距离以外。
      - 遇到避不开的狗，直接转身走开或躲到车后、树后，不要让它正面对着。
      - 换成安静的时段和路线遛狗（清早、小路），先减少每天被刺激的次数。
      - 每次它看到狗但没叫，马上给零食；叫了就带它走远，不骂它，它不是故意的。
      - 用胸背不用项圈或 P 链，避免冲的时候勒到脖子，把疼痛和看见狗联系起来。
    escalate_if: 每次出门都会爆发、在安全距离也无法吃零食，或者有咬人、咬狗的情况，立即停止自己练接近，咨询专业训犬师。
sources:
  - 松绳行走方法参考 Grisha Stewart《BAT 2.0》关于牵绳反应性的距离管理，以及 AKC "Loose Leash Walking" 公开指南
