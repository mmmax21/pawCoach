scoring_hint: 完全做到 = 最后 7 遍（第 5、6 步）里 6 遍以上只用口令加手势就趴下；部分做到 = 3-5 遍；没做到 = 2 遍以下或仍需零食拖到地上才趴。
downgrade_to: sit
sources:
  - 诱导法教趴下（luring the down），参见 AKC "How to Teach Your Dog to Lie Down" 公开文章及 Karen Pryor Clicker Training 官网
  - 中间动作分步奖励（shaping），参见 Karen Pryor《Don't Shoot the Dog》
