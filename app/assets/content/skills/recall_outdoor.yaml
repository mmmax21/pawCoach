    duration_sec: 60
    voice: true
    clicker_hint: true
  - step: 5
    instruction: 结束。给一块零食，说"去玩吧"，让它再自由闻一会儿再回家。
    duration_sec: 30
    voice: true
    clicker_hint: false
scoring_hint: 完全做到 = 今天 10 次召回中 8 次以上狗自己跑回来，没有靠收绳；部分做到 = 5-7 次；没做到 = 4 次以下，或大多数需要收绳才回来。
downgrade_to: recall_indoor
sources:
  - 长绳召回训练法（long line recall），参见 AKC "How to Teach Your Dog to Come When Called" 与 Karen Pryor Clicker Training 户外召回公开教程
  - 召回后放狗继续玩、避免"召回 = 结束"的原则，参见 Ian Dunbar 及 Patricia McConnell 相关公开资料
