scoring_hint: 完全做到 = 最后 6 遍中 5 遍以上听到"玩具"就咬玩具并玩 5 秒以上；部分做到 = 3-4 遍；没做到 = 2 遍以下或仍然追着手咬。
downgrade_to: null
sources:
  - 转移注意法（redirection），参见 AKC "How to Stop Puppy Biting" 公开文章与 Ian Dunbar《Before & After Getting Your Puppy》
