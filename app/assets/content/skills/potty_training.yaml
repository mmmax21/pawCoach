scoring_hint: 完全做到 = 今天带出去的所有次数里，5 分钟内解决的占 80% 以上，且家里 0 次意外；部分做到 = 50%-80% 或家里 1 次意外；没做到 = 50% 以下或家里 2 次以上意外。
downgrade_to: null
sources:
  - 幼犬定点排泄训练法（固定时间表 + 定点奖励 + 含酶清洁剂），参见 AKC "How to Potty Train a Puppy" 与 Humane Society 公开资料
  - 不惩罚室内意外、只管理与奖励的原则，参见 Ian Dunbar "Before and After Getting Your Puppy" 公开章节
