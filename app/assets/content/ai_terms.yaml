# AI 检索分词词表（M3 简报第 5 节第二层）
# 每个词映射到若干内容 ID（技能或问题行为）。
# 客户端用最大匹配分词，对用户消息中出现的词累计各 ID 的命中数。
# 同一个词可以映射多个 ID。

terms:
  # 基础服从
  - { word: 坐下, ids: [sit] }
  - { word: 说坐, ids: [sit] }
  - { word: 坐着, ids: [sit] }
  - { word: 坐好, ids: [sit] }
  - { word: 不坐, ids: [sit] }
  - { word: 趴下, ids: [down] }
  - { word: 名字, ids: [name_response, not_coming] }
  - { word: 叫它, ids: [name_response, not_coming] }
  - { word: 叫名字, ids: [name_response] }
  - { word: 不理我, ids: [name_response, not_coming] }
  - { word: 不看我, ids: [name_response] }
  - { word: 响片, ids: [marker_intro] }
  - { word: 标记词, ids: [marker_intro] }
  - { word: 零食引导, ids: [lure_follow] }
  - { word: 跟着手, ids: [lure_follow] }
