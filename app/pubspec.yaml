name: puppy_trainer
description: 幼犬训练 App（M1 骨架与建档；M2 跟练、记录打卡、周报）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^2.6.1
  drift: ^2.22.0
  drift_flutter: ^0.2.2
  go_router: ^14.6.2
  yaml: ^3.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.28
  flutter_tts: ^4.2.5
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  wakelock_plus: ^1.8.2
  image_picker: ^1.2.4
  workmanager: ^0.10.10
  dio: ^5.11.1
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/skills/
    - assets/content/issues/
    - assets/audio/

# BUG-M3-003: preserve the requested first date for Android daily reminders.
dependency_overrides:
  flutter_local_notifications:
    path: ../third_party/flutter_local_notifications
