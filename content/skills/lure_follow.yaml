scoring_hint: 完全做到 = 最后 3 遍空手手势里 3 遍狗都跟着走完；部分做到 = 1-2 遍；没做到 = 0 遍，或者有零食在手也跟不到 1 米。
downgrade_to: null
sources:
  - 诱导法（luring）基础，参见 Karen Pryor Clicker Training 官网 "Luring" 词条及 AKC 幼犬基础训练公开资料
  - Ian Dunbar《Before and After Getting Your Puppy》中的 lure-reward training
