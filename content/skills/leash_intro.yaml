    duration_sec: 15
    voice: true
    clicker_hint: false
scoring_hint: 完全做到 = 整个练习狗没有趴下不动、没有咬绳超过 5 秒，最后 4 遍"走吧"中 3 遍以上跟着走了 5 步；部分做到 = 能戴着走动但"走吧"只做到 1-2 遍，或者中间咬绳 1-2 次；没做到 = 戴上后趴着不动超过 30 秒，或者一直咬绳、抓挠项圈。
downgrade_to: null
sources:
  - 牵绳脱敏与正向关联（desensitization and counter-conditioning），参见 AKC "How to Leash Train a Puppy" 公开文章与 Grisha Stewart《The Official Ahimsa Dog Training Manual》
