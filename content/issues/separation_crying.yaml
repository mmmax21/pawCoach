id: separation_crying
name: 独处时哭叫
category: anxiety
typical_age_weeks: [8, 24]
diagnosis_tree:
  - q: 狗来家里多久了？
    options:
      - text: 不到两周，刚到新家
        next: 1
      - text: 已经两周以上
        next: 2
  - q: 什么时候哭？
    options:
      - text: 主要是晚上睡觉的时候
        result: new_home_night_crying
      - text: 白天只要一个人待着就哭
        result: alone_time_buildup
  - q: 你出门后它一般怎样？
    options:
      - text: 哭一会儿（10 分钟内）就安静了
        result: alone_time_buildup
      - text: 一直哭，回来发现流口水、刨门、尿在笼里
        next: 3
      - text: 只要你在另一个房间它也哭，人在家也不行
        result: alone_time_buildup
  - q: 它单独待的地方是？
    options:
      - text: 关在航空箱或围栏里
        next: 4
      - text: 家里自由活动
        result: separation_distress
  - q: 平时你在家的时候，它愿意自己进笼子待着吗？
    options:
      - text: 不愿意，一进去就叫
        result: crate_aversion
      - text: 愿意，在家时进笼子没问题
        result: separation_distress
solutions:
  new_home_night_crying:
    summary: 刚离开妈妈和兄弟姐妹的幼犬，头几晚哭是正常的，它从来没有一个人睡过。这阶段不需要"训练"，需要的是让它有安全感，并顺便把笼子变成好地方。
    skills: [crate_intro]
    management:
      - 头一两周把航空箱或围栏放在你床边，让它看得到、闻得到你，晚上哭了可以把手伸过去让它闻闻。
      - 笼子里放一件带你气味的旧 T 恤、一个有温度的暖水袋（裹好）和一个安全的啃咬玩具。
      - 睡前 1 小时停水，睡前带去尿一次，半夜叫得很急可能真的要尿，安静地带出去尿完再放回，不互动不开灯。
      - 白天多做几次"进笼子吃好吃的"，让它觉得笼子是自己的窝，而不是只有晚上才被关进去。
      - 别因为哭就抱上床，也别因为哭就吼它，前者学会"哭有用"，后者更害怕。安静等它停 3 秒再给关注。
    escalate_if: 两周后晚上还是哭超过半小时，或者伴随不吃饭、拉稀、精神差，先去看兽医排除身体不适。
  alone_time_buildup:
    summary: 狗还没学会"你走了还会回来"，哭是不安，不是故意闹。解决方式是从几秒钟开始练独处，一点点加长，让它积累"一个人待着也没事"的经验。
    skills: [crate_intro, alone_time, down, calm_settle]
    management:
      - 出门前 30 分钟带它好好活动或做一次嗅闻游戏，累了更容易安静。
      - 离开和回来都平淡处理，不说再见、不激动打招呼，回家后等它安静了再理它。
      - 每次离开给一个只有独处时才有的好东西，比如塞了食物的漏食玩具，回家就收走。
      - 先在家里练：你去另一个房间关门 10 秒再回来，不哭就慢慢加到 1 分钟、5 分钟，再练真的出门。
      - 全家统一：不要有人偷偷溜回去安慰它，也不要有人出门前跟它依依不舍。
    escalate_if: 按步骤练 3-4 周，独处时间还没法超过 10 分钟，或者出现自残（咬自己、刨到流血）、不吃不喝，找训犬师，必要时先看兽医。
  crate_aversion:
    summary: 问题不在独处，在笼子本身。它还没把笼子当成安全的窝，只当成"被关起来的地方"。先把笼子关系修好，再谈独处。
    skills: [crate_intro, alone_time]
    management:
      - 暂时别把它关进笼子出门，先用围栏或封闭的小房间过渡。
      - 笼子门先一直开着，每天往里丢零食、在里面喂饭，让它自己进出，谁都不许把它推进去。
      - 等它愿意自己进去待着，再练关门：关 2 秒开门给零食，慢慢加时间，你全程在旁边。
      - 笼子别用来"冷静"或作为出错后的去处，它应该只跟好事挂钩。
      - 家里每个人都要知道：笼子门关着的时候它没哭才开门，哭的时候等它停 3 秒再开，不然它学会"哭了就能出来"。
    escalate_if: 2-3 周后在家时它仍然一进笼就持续叫，或者关门后出现狂刨、咬笼门到伤到自己，停止使用笼子并咨询训犬师。
  separation_distress:
    summary: 长时间哭叫加上流口水、刨门、在不该尿的地方尿，说明它独处时是真的恐慌，不是在"闹"。这种情况单靠在家练很难，需要专业帮助，当下先尽量别让它再经历恐慌。
    skills: [alone_time, calm_settle]
    management:
      - 最近几周尽量别让它单独待着：找人帮忙照看、带它上班、或用日托，每次独自恐慌都会让问题加重。
      - 先去看兽医，排除身体不适，并和兽医聊聊目前的情况。
      - 装一个摄像头，记录你出门后它多久开始哭、哭多久、做了什么，这些记录训犬师会需要。
      - 如果它在笼里更恐慌，就别用笼子，改用封闭房间加围栏。
      - 回家时发现乱尿、东西被刨坏，不要说它，安静收拾，它当时是害怕不是捣乱。
    escalate_if: 这条本身就是升级：先就医排除身体原因，然后尽快找有分离焦虑经验的训犬师或行为咨询师，不要自己硬扛。
sources:
  - 独处训练与分离焦虑分级参考 ASPCA 分离焦虑公开资料及 Malena DeMartini《Treating Separation Anxiety in Dogs》
  - 幼犬夜间安抚和笼内训练参考 AKC 幼犬第一夜公开指南
