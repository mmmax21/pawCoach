id: chewing_furniture
name: 啃家具 / 鞋子
category: house
typical_age_weeks: [10, 32]
diagnosis_tree:
  - q: 它一般什么时候啃？
    options:
      - text: 你在家、它醒着的时候就啃
        next: 1
      - text: 主要是你不在家或没盯着的时候
        next: 2
      - text: 什么时候都啃，感觉嘴停不下来
        next: 1
  - q: 现在多大？
    options:
      - text: 3-7 个月，正在换牙
        result: teething_chewing
      - text: 7 个月以上，牙早换完了
        next: 3
  - q: 你回家时它什么样？
    options:
      - text: 东西啃坏了，但它本身挺正常
        result: unsupervised_chewing
      - text: 除了啃东西，还有刨门、乱尿、流口水、一直哭叫
        result: anxiety_chewing
  - q: 它每天的活动量和互动大概是？
    options:
      - text: 每天有出门遛、有玩游戏、有训练
        result: teething_chewing
      - text: 基本在家待着，遛得少，大部分时间没人陪
        result: boredom_chewing
solutions:
  teething_chewing:
    summary: 3-7 个月是换牙期，牙龈又痒又疼，啃东西是它缓解不适的方式，啃什么全凭顺手。换完牙的狗如果活动量够还是爱啃，多半是嘴闲不住的习惯，处理方式一样。不用阻止它啃，要做的是让它啃该啃的，并且让不该啃的够不着。
    skills: [redirect_to_toy, crate_intro, calm_settle]
    management:
      - 鞋子、充电线、遥控器收进柜子或抬高，桌腿、沙发角可以用苦味喷剂（宠物专用），先在小块试一下不掉色。
      - 准备 5-6 个不同硬度的啃咬玩具，每天只放 2-3 个，轮换着给，它会觉得一直有新的。
      - 换牙期准备几个冷冻的：湿毛巾拧成绳冻一下、冻过的胡萝卜条，凉的能缓解牙龈不适。
      - 看到它嘴凑向家具，别喊，拿玩具过去递到嘴边，它接了就夸。做到了几次之后它会自己找玩具。
      - 没人盯着的时候放围栏或笼子里，里面放一个塞了食物的啃咬玩具。
    escalate_if: 换牙期过了（8 个月后）还严重啃，或者啃的时候牙龈出血很多、不吃硬的东西、拒绝啃任何玩具，先去看兽医检查口腔。
  unsupervised_chewing:
    summary: 它只在没人管的时候啃，因为那时候没人告诉它什么能啃，而家具啃起来又确实挺爽。这是管理问题：先把自由活动的范围管住，等它养成"只啃玩具"的习惯再慢慢放开。
    skills: [crate_intro, redirect_to_toy, alone_time]
    management:
      - 出门或忙的时候把它放进围栏、笼子或一个收拾干净的小房间，里面只留它能啃的东西。
      - 每次出门给一个漏食玩具或冻过的塞食 Kong，让它有事做。
      - 在家时每周做几次"自由活动试验"：放它出来 10 分钟，你在旁边假装忙，它只啃玩具就夸，啃家具就递玩具。没问题了再慢慢加时间。
      - 回家发现东西被啃了，什么都别说，安静收拾。事后的责备它完全对不上号，只会学会"主人回家时要害怕"。
      - 全家统一：出门前谁最后走谁负责把它安置好，别出现"以为别人关了"的情况。
    escalate_if: 管理到位 4 周后，一放出来就立刻啃，完全不碰玩具；或者开始啃墙、啃门框、吞下碎片，找训犬师，吞了东西先看兽医。
  boredom_chewing:
    summary: 牙换完了还一直啃，大多是精力没地方用，嘴闲不住。幼犬一天需要的活动和脑力游戏远比很多人以为的多，没得干就自己找乐子，家具就是乐子。
    skills: [redirect_to_toy, name_response, sit, calm_settle]
    management:
      - 每天至少两次出门，不只是上厕所，要让它慢慢闻、走够。嗅闻比快走更累。
      - 把一餐狗粮改用漏食玩具、嗅闻垫或撒在草地上让它找，吃饭就是脑力活动。
      - 每天 2-3 次、每次 5 分钟的小训练（坐下、名字、趴着），训完它会比跑半小时还累。
      - 啃咬玩具轮换，每天换 2-3 个，一直摆着同一个很快就没意思了。
      - 想啃家具时拿玩具换，接了就夸，然后一起玩一会儿，让它知道找玩具不只是有东西啃，还能换来陪玩。
    escalate_if: 活动量明显提高 3-4 周后仍然每天啃坏东西，或者啃的目标转向墙面、地板、自己的尾巴和爪子，找训犬师，啃自己的话先看兽医。
  anxiety_chewing:
    summary: 啃东西加上刨门、乱尿、流口水、长时间哭叫，这不是无聊，是它一个人待着时在恐慌，啃是它发泄压力的方式。这种情况要当成分离焦虑处理，不是当成拆家。
    skills: [crate_intro, alone_time, calm_settle]
    management:
      - 先去看兽医排除身体不适，顺便和兽医聊目前的情况。
      - 最近几周尽量别让它独自在家：找人照看、带它上班或用日托，每次恐慌都会加重问题。
      - 装一个摄像头，记录你出门后多久开始啃、同时还做了什么，这些对训犬师很重要。
      - 如果它在笼子里更慌、啃笼门，就别关笼子，改用封闭房间加围栏，把危险的东西拿走。
      - 回家不要说它，被啃坏的东西安静收走，它当时是害怕不是捣蛋。
    escalate_if: 这条本身就是升级：先就医排除身体原因，然后尽快找有分离焦虑经验的训犬师或行为咨询师。如果它啃到牙齿、嘴、爪子受伤，立即就医。
sources:
  - 幼犬啃咬管理参考 ASPCA 破坏性啃咬公开资料及 AKC 幼犬换牙期公开指南
  - 分离焦虑相关啃咬的识别参考 Malena DeMartini《Treating Separation Anxiety in Dogs》
