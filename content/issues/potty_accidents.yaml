id: potty_accidents
name: 室内乱尿
category: house
typical_age_weeks: [8, 20]
diagnosis_tree:
  - q: 乱尿通常是什么情况？
    options:
      - text: 没什么规律，家里各处都可能尿
        next: 1
      - text: 见到人、被摸、被说的时候漏一点
        next: 2
      - text: 总是在固定几个地方（旧地毯、门口、尿垫旁边）
        next: 3
  - q: 最近有没有这些情况：尿得很频繁、每次只尿一点点、尿里带血或颜色不对、喝水明显变多？
    options:
      - text: 有其中任何一个
        result: rule_out_medical
      - text: 都没有，吃喝精神都正常
        result: house_training_reset
  - q: 漏尿的时候狗是什么样？
    options:
      - text: 扭着身子、尾巴狂摇、整个很兴奋
        result: excitement_urination
      - text: 缩着、耳朵往后贴、翻肚皮
        result: excitement_urination
      - text: 不只是互动的时候，躺着、走着也会漏
        result: rule_out_medical
  - q: 那个固定的地方是？
    options:
      - text: 之前尿过的地方，反复尿同一处
        result: house_training_reset
      - text: 尿垫旁边、门口，离"正确位置"就差一点
        result: pad_confusion
solutions:
  house_training_reset:
    summary: 8-20 周的幼犬膀胱小、憋不住，"随处尿"基本都是定点训练还没建立，不是它故意的。核心就三件事：带得够勤、看得够紧、尿对了立刻奖励。如果它总回同一个地方尿，多半是那里的气味没清干净，先用含酶清洁剂彻底处理。
    skills: [potty_training, crate_intro]
    management:
      - 按固定时间带去尿点：睡醒、吃完饭后 10-15 分钟、玩完、以及中间每 1-2 小时一次。年龄每大一个月，可以多撑一小时。
      - 没人能盯着的时候，放进围栏或航空箱，别让它在家里自由活动。狗一般不会在自己睡觉的地方尿。
      - 在尿点尿完的 3 秒内给零食和夸奖，等回了屋再给就没用了。
      - 尿错地方用含酶的宠物专用清洁剂彻底清理，普通清洁剂和消毒水去不掉气味，它闻到还会回去尿。
      - 全家用同一个尿点、同一个口令、同一个作息表，贴在冰箱上，谁带都一样。
    escalate_if: 严格按时间表带 3 周还没有任何进步，或者本来已经学会了又突然倒退，先去看兽医排除泌尿问题，再找训犬师。
  pad_confusion:
    summary: 尿在尿垫旁边、门口，说明它已经知道"大概要去那儿"，只是位置概念还不精确。这一步离成功很近，稍微调整环境就行。
    skills: [potty_training]
    management:
      - 把尿垫范围临时扩大：铺 2-3 张拼在一起，或用带围边的尿盆，等它稳定命中后再一张张撤。
      - 尿垫别频繁挪位置，固定一处至少两周；如果以后想改成户外，每天挪 20-30 厘米慢慢往门口移。
      - 尿垫上留一小块它尿过的（别全换新），气味能帮它定位。
      - 它走到尿垫附近开始转圈、嗅地，就把它引到垫子正中间，尿对了立刻奖励。
      - 门口总是尿，很可能是它想出去但你没发现，试着在门口挂个铃铛教它碰铃。
    escalate_if: 调整环境 2-3 周后命中率没提高，或者开始出现尿频、尿量很少的情况，先去看兽医排除。
  excitement_urination:
    summary: 幼犬在太兴奋或有点害怕的时候会控制不住漏一点尿，这跟定点训练无关，是情绪问题，大多数狗长大会自然好转。重点是把打招呼变得平淡，别让它过度激动。
    skills: [sit, calm_settle, potty_training]
    management:
      - 回家、来客人时先不看它、不摸它、不说话，等它平静下来再低声打招呼。
      - 打招呼时蹲下来、侧身、不要从正上方俯身摸头，这个姿势对小狗有压迫感。
      - 漏尿了什么都别说，安静收拾，任何责备都会让它下次更紧张漏得更多。
      - 回家前先把它带到尿点尿空，再进屋互动。
      - 告诉所有家人和客人同样的规矩："进门先冷淡，平静了才摸"。
    escalate_if: 6 个月大以后还经常漏尿，或者漏尿时伴随明显害怕（发抖、躲藏），先去看兽医排除生理原因，再考虑训犬师介入。
  rule_out_medical:
    summary: 尿频、尿量少、尿里带血、突然喝水变多，这些跟训练没关系，可能是身体不舒服。任何训练都先等兽医看过再说。
    skills: [potty_training]
    management:
      - 尽快带去看兽医，带上最近一两天的观察记录：尿了几次、每次多少、有没有异常颜色。
      - 就医之前先不要调整训练方式，也不要因为乱尿说它。
      - 多准备几张尿垫铺在它常待的地方，方便它、也方便你观察。
      - 兽医确认没问题后，再回到定点训练的方案。
    escalate_if: 这条本身就是升级：先就医排除泌尿或其他身体问题，兽医确认健康后再做训练。
sources:
  - 定点训练流程参考 AKC 幼犬如厕训练公开指南及 Ian Dunbar《Before and After Getting Your Puppy》中的围栏管理方法
  - 兴奋 / 服从性漏尿的处理参考 ASPCA 公开行为资料
