id: jumping_on_people
name: 扑人
category: puppy_behavior
typical_age_weeks: [12, 40]
diagnosis_tree:
  - q: 它主要扑谁？
    options:
      - text: 主要扑家里人，比如回家的时候
        next: 1
      - text: 主要扑客人或路上的陌生人
        next: 2
      - text: 谁都扑，随时随地
        next: 1
  - q: 扑的时候是什么样？
    options:
      - text: 尾巴狂摇、嗷嗷叫、整个很兴奋
        result: greeting_jumping
      - text: 你手里有吃的或玩具它才扑
        result: demand_jumping
      - text: 你坐着或走路时也会扑、用嘴叼衣服
        result: demand_jumping
  - q: 扑陌生人的时候，它看起来？
    options:
      - text: 很兴奋、想玩，被摸了更起劲
        result: greeting_jumping
      - text: 毛竖着、叫声紧张，或者扑完就躲
        result: fearful_jumping
solutions:
  greeting_jumping:
    summary: 扑人是幼犬想靠近你的脸打招呼，而且每次扑了都有人摸它、看它、说话，这都是奖励。方法是让"四脚着地"或"坐下"才能得到关注，扑了反而什么都得不到。
    skills: [sit, stay_short, calm_settle]
    management:
      - 它扑上来时转身、抱手、不看不说，脚一落地就马上转回来摸它。要快，别等它再扑第二次。
      - 回家先不打招呼，放下东西、换鞋，等它安静了再蹲下来摸。狗越兴奋越要平淡。
      - 进门前先在门外准备几粒零食，一开门就丢在地上，让它低头捡而不是往上跳。
      - 来客人前先把它牵好或放围栏，等客人坐下、它平静了再放出来打招呼。
      - 全家和常来的朋友规则一致：只要它四脚着地或坐下就能摸，扑了就谁也不理。只要有一个人扑了也摸，前面全白练。
    escalate_if: 一致执行 4 周没改善，或者扑的时候开始用嘴叼、咬手臂衣服很用力，或者家里有老人小孩被扑倒过，找训犬师。
  demand_jumping:
    summary: 它已经学会"扑一下就有东西"：扑你手里的零食、扑你要你陪玩、扑了你就跟它说话。这不是打招呼，是要东西。要让它知道，坐下安静才会有，扑了反而什么都没有。
    skills: [sit, stay_short, down, calm_settle]
    management:
      - 零食和玩具举高不算，狗会跳得更高。改成握在手里放在胸前不动，等它四脚着地或坐下再给。
      - 它扑上来要东西时站起来走开 10 秒，再回来给它一个"坐下"的机会。
      - 每天固定几次主动给它关注和游戏，别让它只能靠扑来争取。
      - 你吃饭、办公时让它在垫子上趴着，提前给个啃咬玩具，不要等它扑了再给。
      - 家里所有人都要做到"扑了不给"，包括零食、玩具、说话、眼神。
    escalate_if: 3-4 周没改善，或者不给就开始叫、咬裤腿、推撞得越来越用力，找训犬师。
  fearful_jumping:
    summary: 有些狗紧张时也会扑人，看起来像热情，其实是不知道该怎么办。这种扑人不能用"不理它"处理，重点是别让它在压力下硬撑，先减少让它紧张的场面，再慢慢建立信心。
    skills: [name_response, sit, calm_settle]
    management:
      - 遇到陌生人时先保持距离，让它在不紧张的距离看一看、闻一闻，给零食，然后走开。不要强迫它被摸。
      - 跟陌生人说"请不要摸它、不要看它",让它自己决定要不要靠近。
      - 牵绳别拉紧，拉紧会让它更紧张；用名字把它叫回你身边，给零食，坐下。
      - 社交场合控制时长，每次 5-10 分钟，它还没累就结束。
      - 记录哪些人、哪些场景会让它这样，一般有规律（高个男性、戴帽子、小孩跑动等），训练时从最容易的开始。
    escalate_if: 扑人时伴随低吼、龇牙、咬衣服，或者在陌生人靠近时明显发抖、躲藏，尽快找训犬师做社会化评估，别自己硬练。
sources:
  - 扑人处理参考 AKC 幼犬扑人公开指南及 Karen Pryor Academy 正向训练公开资料
  - 紧张型扑人的识别参考 ASPCA 犬类肢体语言公开资料
