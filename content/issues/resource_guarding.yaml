id: resource_guarding
name: 护食 / 护玩具
category: puppy_behavior
typical_age_weeks: [12, 52]
diagnosis_tree:
  - q: 它护的是什么？
    options:
      - text: 食物：狗粮、零食、骨头、咬胶
        next: 1
      - text: 玩具、捡到的东西（袜子、纸巾、骨头）
        next: 2
      - text: 地方或人：沙发、床、笼子，或者护着某个家人
        next: 3
  - q: 你靠近它吃东西的时候，它有什么反应？
    options:
      - text: 吃得更快、身体挡着碗、眼睛盯着你，但没有出声
        result: guarding_early
      - text: 僵住不动、低吼、龇牙、或者有过咬人
        result: guarding_escalated
  - q: 你想拿走的时候它怎么样？
    options:
      - text: 叼着跑开、不肯松口，但没有凶你
        result: guarding_objects
      - text: 僵住、低吼、龇牙，或者有过咬人
        result: guarding_escalated
  - q: 你靠近或想让它下来的时候？
    options:
      - text: 不肯动，但没有低吼或龇牙
        result: guarding_early
      - text: 僵住、低吼、龇牙，或者有过咬人
        result: guarding_escalated
solutions:
  guarding_early:
    summary: 它已经有点紧张"你会拿走我的东西"，但还在用最轻的方式表达。这个阶段最重要的是让它相信"有人靠近 = 好事发生"，而不是去证明"我能拿走"。千万不要为了"立规矩"故意去碰它的碗或者拿走食物，那只会让它更确定你是威胁。
    skills: [marker_intro, name_response, handling_body]
    management:
      - 它吃饭的时候所有人离远一点，不碰碗、不伸手、不站在旁边看，让它安安静静吃完。
      - 换着吃：它吃狗粮的时候，你从 2 米外走过顺手丢一块比狗粮好吃的零食到碗里然后走开，每天来几次，让它觉得你靠近碗是来加菜的。
      - 多犬家庭分开喂，各自在不同房间或围栏里吃，吃完再放出来。
      - 家里人尤其是小孩，吃饭时间不靠近狗，不逗它、不伸手拿它东西。
      - 想让它从沙发下来时不用手推不用拽，拿零食引导到地上，下来了就给。
    escalate_if: 出现身体僵硬、低吼、龇牙中的任何一项，立即停止自行训练，咨询专业训犬师。
  guarding_objects:
    summary: 它叼着东西跑是因为它学到"被看到 = 东西会没了"。追着抢只会让它跑得更快、护得更紧。目标是教它"松口换更好的"，让交出东西变成一件划算的事。
    skills: [marker_intro, redirect_to_toy, lure_follow]
    management:
      - 不去拿：它叼着的东西只要不危险（袜子、纸巾），就不追不抢，装作没看见，它觉得没意思就会自己放下。
      - 把家里收干净，袜子、鞋、纸巾放高放好，它捡不到就不需要护。
      - 用更好的换：它叼着东西时你拿着零食坐在一边，它过来松口吃零食后再把东西收起来，或者把玩具还给它让它知道交出去还能拿回来。
      - 平时玩玩具时练"换一个"：它咬着 A 玩具，你拿 B 玩具逗它，它松开 A 咬 B 就说"好"，再把 A 还给它。
      - 分开管理：有多只狗或有小孩的家庭，给它特别珍贵的东西（咬胶、骨头）时让它单独在围栏里享用。
    escalate_if: 出现身体僵硬、低吼、龇牙中的任何一项，立即停止自行训练，咨询专业训犬师。
  guarding_escalated:
    summary: 僵住、低吼、龇牙、咬人，这些都是它在明确警告"再靠近我就动手"。这不是自己在家能练的问题，也不是它"坏"，而是它真的很怕失去东西。现在唯一要做的是避免冲突、保证家人安全，然后尽快找专业训犬师。
    skills: [marker_intro, handling_body]
    management:
      - 立即停止所有拿走食物、碰碗、抢玩具的行为，包括"测试一下它现在还护不护"。
      - 吃饭时把它关在单独房间或围栏里，吃完、碗空了再放它出来，碗在它不在场的时候收。
      - 它正在吃或咬的时候，所有人尤其是小孩保持至少 2 米距离，不靠近、不盯着看。
      - 暂时不给特别珍贵的东西（骨头、牛皮咬胶），减少它需要护的场合。
      - 如果它叼了危险的东西（药、小骨头），用一把好吃的零食撒在远处把它引开，趁它去吃的时候收东西，不要伸手去它嘴里掏。
    escalate_if: 这个方案本身就是升级信号：只要出现过僵硬、低吼、龇牙、咬人中的任何一项，立即停止自行训练，咨询专业训犬师。不要等。
sources:
  - 护资源处理方法参考 Jean Donaldson《Mine! A Practical Guide to Resource Guarding in Dogs》及 ASPCA "Food Guarding" 公开资料
