id: excessive_barking
name: 乱叫
category: puppy_behavior
typical_age_weeks: [12, 52]
diagnosis_tree:
  - q: 它主要在什么情况下叫？
    options:
      - text: 对着你叫，想要零食、想玩、想被放出来，或者没事干就叫
        result: demand_barking
      - text: 听到门外有声音、看到窗外有人有狗就叫
        next: 1
      - text: 你不在家或不在它身边的时候叫
        result: alone_barking
  - q: 叫了之后它能停下来吗？
    options:
      - text: 叫几声就停，声音走了它也就算了
        result: alert_barking
      - text: 停不下来，越叫越激动，还会扑门扑窗
        next: 2
  - q: 叫的时候身体是什么状态？
    options:
      - text: 尾巴摇、来回跑，像在兴奋
        result: alert_barking
      - text: 炸毛、身体绷紧、低吼，或者夹着尾巴往后退
        result: fearful_barking
solutions:
  demand_barking:
    summary: 它学会了"叫 = 能得到想要的"，哪怕你只是看它一眼、说一句"别叫"也算回应。再加上幼犬精力旺盛，没地方用就靠叫来找事。要让它发现安静才有用，教它一个替代行为，同时把精力花掉。
    skills: [sit, down, redirect_to_toy, calm_settle]
    management:
      - 它为了要东西而叫的时候，转身、不看、不说话，等它安静 2-3 秒再给它想要的。
      - 刚开始它会叫得更凶（"以前这招管用啊"），这是正常的，这时候最不能妥协，家里每个人规则要一致。
      - 在它还没开始叫之前主动给，比如坐下了就给零食，让它学会安静坐着比叫管用。
      - 每天至少两次带出门走走闻闻，用漏食玩具、嗅闻垫喂饭，一顿饭能让它忙 15-20 分钟。
      - 它安静趴着的时候悄悄过去放一颗零食，它会慢慢发现安静也有好处。
    escalate_if: 坚持 3-4 周后叫得比之前更频繁，叫的同时开始咬人、扑人，或者出现转圈、咬尾巴这类反复动作，咨询训犬师。
  alert_barking:
    summary: 听到动静叫几声是狗的天性，不用也不可能完全禁止。目标是叫两声就能停下来看你，而不是一直叫。方法是让它把"外面有动静"和"看主人有零食"连起来。
    skills: [name_response, marker_intro, calm_settle]
    management:
      - 听到它叫，先说一声"谢谢"或"知道了"，然后叫名字，它回头就给零食。
      - 用磨砂贴膜或者拉上窗帘下半截，让它看不到窗外来来往往的人和狗。
      - 它常趴的地方别放在门口或窗边，换到离门远一点的角落。
      - 门铃声、敲门声可以用手机录下来小声放，放的同时给零食，慢慢把音量调大。
      - 不要跟着它一起喊"别叫"，在它听来这是你也在叫。
    escalate_if: 练习 4 周后叫的时间反而变长，或者一有动静就扑门撞门、叫到嗓子哑，咨询训犬师。
  fearful_barking:
    summary: 又炸毛又后退地叫，说明它是害怕，叫是在"吓退"让它不安的东西。这种情况不能让它硬扛，要给它足够的距离，让它在看到或听到刺激时还能冷静下来吃零食。
    skills: [name_response, crate_intro, calm_settle]
    management:
      - 给它一个能躲的地方（航空箱或角落的垫子），害怕的时候能自己过去待着，没人打扰。
      - 暂时减少刺激：拉上窗帘、关上通往门口的房门，让它每天被吓到的次数降下来。
      - 它看到或听到刺激但还没叫的时候，就给零食，叫起来了就带它走开，不骂它。
      - 不要让陌生人直接靠近摸它，让人站着不动，它自己愿意凑过去再说。
      - 出门选安静的时段和路线，不要带它去人多狗多的地方"锻炼胆子"。
    escalate_if: 每次刺激都会叫到停不下来、躲起来发抖，或者有扑咬人的动作，立即停止自行训练，咨询专业训犬师。
  alone_barking:
    summary: 你不在的时候叫，这不是"乱叫"，是分离焦虑或者还没学会一个人待着。处理方式和其他乱叫完全不一样，重点是练独处而不是练安静。建议同时看"独处时哭叫"这个条目，那里有更完整的方案。
    skills: [crate_intro, alone_time, calm_settle]
    management:
      - 先在家里装个摄像头，看看你走后它是几分钟开始叫、叫多久，这决定了练习从几分钟开始。
      - 从你在家的时候开始练，它在围栏里你在隔壁房间待 1 分钟就回来，慢慢加长。
      - 出门和回家都不要搞得很隆重，走的时候不告别，回来先不理它，等它平静了再打招呼。
      - 出门前给一个塞了食物的漏食玩具，让离开和好事绑在一起。
      - 练习期间尽量不要让它独自待超过它目前能承受的时间，请人来看或者送去寄养一段时间都可以。
    escalate_if: 一个人待的时候叫到嗓子哑、拉尿、咬坏笼子或者有自残（咬爪子出血），不要再把它单独留在家，咨询专业训犬师。
sources:
  - 吠叫分类与处理参考 Patricia McConnell《The Bark Stops Here》及 ASPCA "Barking" 公开资料；独处部分参考 Malena DeMartini 分离焦虑训练方法
