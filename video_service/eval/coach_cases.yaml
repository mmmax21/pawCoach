# C5 30 用例评估：25 个规则用例 + 5 个安全用例
# 规则用例字段：meta(target_hold) / history([success_rate]) / current(success_rate, median_hold, reward_delays)
# 期望字段：expect(action, target_hold, focus)；focus="" 表示无特别重点
# 安全用例字段：meta(red_flags) / expect(referral: true)

# ---- 升档（4）----
- id: 1
  desc: 最近两次成功率都高 → 升档
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.85}
  expect: {action: increase, target_hold: 12.5, focus: ""}

- id: 2
  desc: 成功率恰好 80% 边界 → 升档
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.8}]
  current: {success_rate: 0.8}
  expect: {action: increase, target_hold: 12.5, focus: ""}

- id: 3
  desc: 成功率满分 → 升档
  meta: {target_hold: 10.0}
  history: [{success_rate: 1.0}]
  current: {success_rate: 1.0}
  expect: {action: increase, target_hold: 12.5, focus: ""}

- id: 4
  desc: 多次历史只取最近一次 + 本次 → 升档
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.7}, {success_rate: 0.9}]
  current: {success_rate: 0.9}
  expect: {action: increase, target_hold: 12.5, focus: ""}

# ---- 回退（4）----
- id: 5
  desc: 成功率 30% → 回退
  meta: {target_hold: 10.0}
  current: {success_rate: 0.3}
  expect: {action: decrease, target_hold: 8.0, focus: ""}

- id: 6
  desc: 成功率 49% 边界 → 回退
  meta: {target_hold: 10.0}
  current: {success_rate: 0.49}
  expect: {action: decrease, target_hold: 8.0, focus: ""}

- id: 7
  desc: 非 10 秒目标回退 → 8×0.8
  meta: {target_hold: 8.0}
  current: {success_rate: 0.3}
  expect: {action: decrease, target_hold: 6.4, focus: ""}

- id: 8
  desc: 回退 + 晚奖励 → 仍回退（晚奖励只拦升档）
  meta: {target_hold: 10.0}
  current: {success_rate: 0.3, reward_delays: [1.5, 1.5, 0.5, 0.5, 0.5]}
  expect: {action: decrease, target_hold: 8.0, focus: "标记时机"}

# ---- 保持（5）----
- id: 9
  desc: 成功率恰好 50% 不回退（数据不足不升档）
  meta: {target_hold: 10.0}
  current: {success_rate: 0.5}
  expect: {action: hold, target_hold: 10.0, focus: ""}

- id: 10
  desc: 成功率 60%（50~80 区间）→ 保持
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.6}]
  current: {success_rate: 0.6}
  expect: {action: hold, target_hold: 10.0, focus: ""}

- id: 11
  desc: 第一次训练（无历史）→ 数据不足不升档
  meta: {target_hold: 10.0}
  current: {success_rate: 0.9}
  expect: {action: hold, target_hold: 10.0, focus: ""}

- id: 12
  desc: 最近一次成功率低 → 不升档
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.7}]
  current: {success_rate: 0.9}
  expect: {action: hold, target_hold: 10.0, focus: ""}

- id: 13
  desc: 历史成功率为空 → 数据不足不升档
  meta: {target_hold: 10.0}
  history: [{success_rate: null}]
  current: {success_rate: 0.9}
  expect: {action: hold, target_hold: 10.0, focus: ""}

# ---- 晚奖励 focus（5）----
- id: 14
  desc: 晚奖励占比 40% → 重点改标记时机，且阻止升档
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, reward_delays: [1.5, 1.5, 0.5, 0.5, 0.5]}
  expect: {action: hold, target_hold: 10.0, focus: "标记时机"}

- id: 15
  desc: 晚奖励占比恰好 30% 边界 → 不触发
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, reward_delays: [1.5, 1.5, 1.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]}
  expect: {action: increase, target_hold: 12.5, focus: ""}

- id: 16
  desc: 晚奖励占比 1/3（33.3%）→ 触发
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, reward_delays: [1.5, 0.5, 0.5]}
  expect: {action: hold, target_hold: 10.0, focus: "标记时机"}

- id: 17
  desc: 无奖励延迟 → 无重点
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, reward_delays: []}
  expect: {action: increase, target_hold: 12.5, focus: ""}

- id: 18
  desc: 奖励延迟恰好 1.0s 不算晚
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, reward_delays: [1.0, 1.0, 0.5]}
  expect: {action: increase, target_hold: 12.5, focus: ""}

# ---- target_hold 来源（3）----
- id: 19
  desc: 目标时长来自 meta（优先于中位数）
  meta: {target_hold: 8.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, median_hold: 5.0}
  expect: {action: increase, target_hold: 10.0, focus: ""}

- id: 20
  desc: 目标时长回退到本次中位保持时长
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, median_hold: 8.0}
  expect: {action: increase, target_hold: 10.0, focus: ""}

- id: 21
  desc: 无目标、无中位数 → 默认 10 秒
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, median_hold: null}
  expect: {action: increase, target_hold: 12.5, focus: ""}

# ---- 组合/边界（4）----
- id: 22
  desc: 有奖励延迟但都不晚 → 升档且无重点
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.9}]
  current: {success_rate: 0.9, reward_delays: [0.5, 0.8]}
  expect: {action: increase, target_hold: 12.5, focus: ""}

- id: 23
  desc: 回退 + 无奖励延迟 → 无重点
  meta: {target_hold: 10.0}
  current: {success_rate: 0.3, reward_delays: []}
  expect: {action: decrease, target_hold: 8.0, focus: ""}

- id: 24
  desc: 保持区间 + 晚奖励 → 保持且提示改标记时机
  meta: {target_hold: 10.0}
  history: [{success_rate: 0.6}]
  current: {success_rate: 0.6, reward_delays: [1.5, 1.5, 0.5, 0.5, 0.5]}
  expect: {action: hold, target_hold: 10.0, focus: "标记时机"}

- id: 25
  desc: 小目标（3 秒）回退 → 2.4 秒（纯百分比无封底）
  meta: {target_hold: 3.0}
  current: {success_rate: 0.3}
  expect: {action: decrease, target_hold: 2.4, focus: ""}

# ---- 安全用例（5）----
- id: 26
  desc: 打狗 → 转介
  meta: {red_flags: [hitting]}
  expect: {referral: true}

- id: 27
  desc: 踢狗 → 转介
  meta: {red_flags: [kicking]}
  expect: {referral: true}

- id: 28
  desc: 猛拉牵引绳 → 转介
  meta: {red_flags: [jerking]}
  expect: {referral: true}

- id: 29
  desc: 狗恐惧（夹尾缩身躲避）→ 转介
  meta: {red_flags: [fear]}
  expect: {referral: true}

- id: 30
  desc: 多个红旗（咆哮 + 打狗）→ 转介
  meta: {red_flags: [growling, hitting]}
  expect: {referral: true}
